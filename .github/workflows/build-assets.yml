name: Build profile assets

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # On pull requests: rebuild and fail if committed SVGs are stale; check links. Never commits.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/build_assets.py
      - name: SVGs must match data/profile.json
        run: git diff --exit-code -- assets || (echo "Run python scripts/build_assets.py and commit assets/"; exit 1)
      - run: python scripts/check_links.py

  # On main: rebuild and commit regenerated SVGs.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/build_assets.py
      - run: python scripts/check_links.py
      - name: Commit regenerated SVGs
        run: |
          if git diff --quiet -- assets; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: regenerate profile assets"
          git push
